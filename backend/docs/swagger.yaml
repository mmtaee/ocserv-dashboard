info:
  contact: {}
  description: Administrative API for managing Ocserv Dashboard users, groups, reports,
    runtime, backups, system settings, Telegram integrations, and agent nodes.
  title: Ocserv Dashboard Admin API
  version: "1.0"
paths:
  /auth/logout:
    post:
      parameters:
      - description: Bearer TOKEN
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/request.ErrorResponse'
      summary: Logout current session
      tags:
      - Auth
